org.gradle.jvmargs=-Xmx4G -XX:+UseG1GC -Dfile.encoding=UTF-8
# Only configure the Minecraft versions a command actually needs (Loom sets up Minecraft while configuring).
org.gradle.configureondemand=true
org.gradle.caching=true

mod.id=cosmeticsmod
# The jars are named for the client (solclient-<version>+mc<minecraft>.jar); the mod id stays cosmeticsmod.
mod.jar=solclient
mod.version=0.1.7
mod.group=io.github.georgwav

deps.fabric_loader=0.19.5

# build.gradle is Groovy on purpose (one script applies either Loom variant); acknowledge Stonecutter's notice.
dev.kikugie.stonecutter.hard_mode=true
