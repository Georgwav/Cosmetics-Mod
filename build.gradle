import java.util.spi.ToolProvider

// Shared build script. Stonecutter runs it once per Minecraft version listed in settings.gradle.kts,
// with that version's properties from versions/<version>/gradle.properties.

def mcVersion = stonecutter.current.version
// 26.1+ ships without obfuscation: plain Loom, no mappings, no remapping, Java 25.
def unobfuscated = stonecutter.eval(mcVersion, '>=26.1')
def javaVersion = unobfuscated ? 25 : 21

// Read every property here: inside task closures `property(...)` would resolve against the task.
def prop = { String key -> project.property(key).toString() }
def minecraftVersion = prop('deps.minecraft')
def loaderVersion = prop('deps.fabric_loader')
def fabricApiVersion = prop('deps.fabric_api')
def minecraftDependency = prop('mod.mc_dep')
def loaderMinimum = prop('mod.loader_min')

apply plugin: unobfuscated ? 'net.fabricmc.fabric-loom' : 'net.fabricmc.fabric-loom-remap'

version = "${prop('mod.version')}+mc${mcVersion}"
group = prop('mod.group')
base.archivesName.set(prop('mod.jar'))

repositories {
    mavenCentral()
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraftVersion}"
    if (unobfuscated) {
        implementation "net.fabricmc:fabric-loader:${loaderVersion}"
        implementation "net.fabricmc.fabric-api:fabric-api:${fabricApiVersion}"
    } else {
        mappings loom.officialMojangMappings()
        modImplementation "net.fabricmc:fabric-loader:${loaderVersion}"
        modImplementation "net.fabricmc.fabric-api:fabric-api:${fabricApiVersion}"
    }

    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

loom {
    runs {
        client {
            // Mixin audit in dev: dump every transformed class and verify it, so conflicts with other
            // mods' mixins show up in .mixin.out/ and in the log.
            vmArg '-Dmixin.debug.export=true'
            vmArg '-Dmixin.debug.verify=true'
        }
    }
}

java {
    sourceCompatibility = JavaVersion.toVersion(javaVersion)
    targetCompatibility = JavaVersion.toVersion(javaVersion)
    withSourcesJar()
}

tasks.withType(JavaCompile).configureEach {
    options.release.set(javaVersion)
    options.encoding = 'UTF-8'
}

tasks.named('test') {
    useJUnitPlatform()
    // -Pcosmetics.validatePack=<folder>: ImportedPackTest loads every cosmetic of that resource pack.
    def validatePack = findProperty('cosmetics.validatePack')
    if (validatePack) {
        systemProperty 'cosmetics.validatePack', validatePack
        inputs.property('validatePack', validatePack)
        outputs.upToDateWhen { false }
    }
}

// Which commit the jar was built from, shown in the Wardrobe so it's clear which build is running.
def buildId = (System.getenv('GITHUB_SHA') ?: 'local').take(7)

// Resources that differ by render era (the Sol light pass's post-effect chains and shaders, written by
// tools/sol-assets/make_light_pass.py): each era's folder is added to this version's resources.
def era = stonecutter.eval(mcVersion, '>=26.3') ? 'e6'
        : stonecutter.eval(mcVersion, '>=1.21.9') ? 'e5'
        : stonecutter.eval(mcVersion, '>=1.21.6') ? 'e4'
        : stonecutter.eval(mcVersion, '>=1.21.5') ? 'e3'
        : stonecutter.eval(mcVersion, '>=1.21.2') ? 'e2' : 'e1'
sourceSets.main.resources.srcDir(rootProject.file("src/era/${era}/resources"))

processResources {
    def props = [
            version  : project.version.toString(),
            build    : buildId,
            minecraft: minecraftDependency,
            loader   : loaderMinimum,
            java     : javaVersion.toString(),
    ]
    inputs.properties(props)
    filesMatching('fabric.mod.json') {
        expand(props)
    }
}

// Compile-time stand-ins for Mod Menu's API (src/main/java/com/terraformersmc): never shipped, the
// real classes come from Mod Menu when it's installed.
tasks.named('jar') {
    exclude 'com/terraformersmc/**'
}
tasks.named('sourcesJar') {
    exclude 'com/terraformersmc/**'
}

// The jar players install: remapped to intermediary on 1.21.x, the plain jar on 26.x.
def modJar = tasks.named(unobfuscated ? 'jar' : 'remapJar')

// Personal builds: -Pcosmetics.bundleDir=<pack folder> (relative to this repository's root, or absolute)
// copies that resource pack's assets/ into this jar, which the mod's loader reads like its own cosmetics,
// and names the jar "...-personal.jar". Only for that build; without the property nothing changes.
def bundleDir = providers.gradleProperty('cosmetics.bundleDir').orNull
if (bundleDir) {
    def bundleAssets = new File(rootProject.file(bundleDir), 'assets')
    if (!bundleAssets.isDirectory()) {
        throw new GradleException("cosmetics.bundleDir: ${bundleAssets} is not a folder (point it at a resource pack)")
    }
    processResources {
        from(bundleAssets) {
            into 'assets'
            // A pack file at the same path as one of the mod's own is a mistake, not something to overwrite.
            duplicatesStrategy = DuplicatesStrategy.FAIL
        }
        // Sol Styles' personal styles: the pack's styles/<tab>/<style>/ folders, each a small pack of its own.
        def bundleStyles = new File(rootProject.file(bundleDir), 'styles')
        if (bundleStyles.isDirectory()) {
            from(bundleStyles) {
                into 'solstyles'
            }
        }
    }
    modJar.configure {
        archiveClassifier.set('personal')
    }
}

// Personal builds: -Pcosmetics.bundleKnives=<knives folder> (what you'd drop into client/melee) zips the knife packs
// in it into this jar; the mod unpacks them next to your own knives and mounts them the same way. The packs are all
// rights reserved, so this is for your own jars only: normal CI never does it, and ci/pack_guard.py fails a jar
// that holds them. Names the jar "...-personal.jar" too.
def knivesDir = providers.gradleProperty('cosmetics.bundleKnives').orNull
if (knivesDir) {
    def knivesFolder = rootProject.file(knivesDir)
    if (!knivesFolder.isDirectory()) {
        throw new GradleException("cosmetics.bundleKnives: ${knivesFolder} is not a folder (point it at your knives folder)")
    }
    def knivesZip = tasks.register('bundleKnivesZip', Zip) {
        from(knivesFolder) {
            // The mount's own folders, the dev stand-in and your overrides stay out.
            exclude '.mounted/**', '.bundled/**', 'StandIn/**', 'knives.json'
        }
        archiveFileName = 'knives.zip'
        destinationDirectory = layout.buildDirectory.dir('bundled-knives')
        // The same packs give the same zip, so the mod only unpacks it again when they change.
        preserveFileTimestamps = false
        reproducibleFileOrder = true
    }
    processResources {
        from(knivesZip) {
            into 'solknives'
        }
    }
    modJar.configure {
        archiveClassifier.set('personal')
    }
}

// Sol Styles' part table for this version (src/styles/parts.json): each part's path patterns resolved against this
// version's own client assets, so a part lists exactly the files this version has. The game's jar is found on the
// compile classpath (the jar holding assets/minecraft/). Written to assets/cosmeticsmod/styles/parts.json.
def stylePartsOut = layout.buildDirectory.dir('generated/styleParts')
def styleParts = tasks.register('styleParts') {
    def source = rootProject.file('src/styles/parts.json')
    def classpath = sourceSets.main.compileClasspath
    inputs.file(source)
    inputs.property('mc', mcVersion)
    outputs.dir(stylePartsOut)
    doLast {
        def assets = new TreeSet<String>()
        classpath.files.findAll { it.isFile() && it.name.endsWith('.jar') }.each { file ->
            new java.util.zip.ZipFile(file).withCloseable { zip ->
                if (zip.getEntry('assets/minecraft/textures/block/stone.png') == null) {
                    return
                }
                zip.entries().each { e ->
                    if (!e.isDirectory() && e.name.startsWith('assets/minecraft/')) {
                        assets.add(e.name.substring('assets/minecraft/'.length()))
                    }
                }
            }
        }
        if (assets.isEmpty()) {
            throw new GradleException('styleParts: no jar on the classpath holds the game\'s assets')
        }
        def toRegex = { String glob ->
            def sb = new StringBuilder('^')
            int i = 0
            while (i < glob.length()) {
                char c = glob.charAt(i)
                if (c == '*' && i + 1 < glob.length() && glob.charAt(i + 1) == '*') {
                    sb.append('.*')
                    i += 2
                } else if (c == '*') {
                    sb.append('[^/]*')
                    i++
                } else {
                    sb.append(java.util.regex.Pattern.quote(String.valueOf(c)))
                    i++
                }
            }
            java.util.regex.Pattern.compile(sb.append('$').toString())
        }
        def table = new groovy.json.JsonSlurper().parse(source)
        def parts = table.parts.collect { part ->
            def paths = new TreeSet<String>()
            part.paths.each { glob ->
                def re = toRegex(glob)
                assets.each { if (re.matcher(it).matches()) paths.add(it) }
            }
            def icon = part.icon.find { assets.contains(it) }
            def out = new LinkedHashMap(part)
            out.paths = paths as List
            out.icon = icon
            out
        }.findAll { !it.paths.isEmpty() }
        def file = stylePartsOut.get().file('assets/cosmeticsmod/styles/parts.json').asFile
        file.parentFile.mkdirs()
        def json = [mc: mcVersion, tabs: table.tabs, groups: table.groups, parts: parts]
        file.text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(json)) + '\n'
    }
}
// Given as the task, so everything that reads the resources (the jar, the sources jar) runs it first.
sourceSets.main.resources.srcDir(styleParts)

// Copies every version's jar into <root>/build/libs so CI and releases find them in one place.
tasks.register('collectJar', Copy) {
    group = 'build'
    from(modJar.flatMap { it.archiveFile })
    into(rootProject.layout.buildDirectory.dir('libs'))
}
tasks.named('build') {
    finalizedBy 'collectJar'
}

// Debug aid for porting: ./gradlew :1.21.4:dumpApi -PdumpClasses=net.minecraft.client.Minecraft,...
// prints the public and protected API of those classes exactly as this version's Minecraft has it.
// An entry ending in .* (e.g. net.fabricmc.fabric.api.client.command.v2.*) lists that package's classes; one
// starting with ! also prints private members and bytecode (to see what a method calls), and !Class#text only the
// members whose line contains the text, with their bytecode; ~Class prints every member, private ones too, without
// bytecode; ?text lists the resource files whose path contains the text.
tasks.register('dumpApi') {
    group = 'help'
    def classes = providers.gradleProperty('dumpClasses').orElse('')
    def classpath = sourceSets.main.compileClasspath
    doLast {
        def javap = ToolProvider.findFirst('javap').orElseThrow()
        classes.get().split(',').collect { it.trim() }.findAll { !it.isEmpty() }.each { name ->
            println "===== ${mcVersion} ${name} ====="
            if (name.startsWith('?')) {
                // Resource paths in the game's jars containing the text (any case).
                def needle = name.substring(1).toLowerCase()
                classpath.files.findAll { it.isFile() && it.name.endsWith('.jar') }.each { file ->
                    new java.util.zip.ZipFile(file).withCloseable { zip ->
                        zip.entries().collect { it.name }
                                .findAll { !it.endsWith('.class') && it.toLowerCase().contains(needle) }
                                .each { println "${it}    (${file.name})" }
                    }
                }
            } else if (name.endsWith('.*')) {
                def prefix = name[0..-3].replace('.', '/') + '/'
                classpath.files.findAll { it.isFile() && it.name.endsWith('.jar') }.each { file ->
                    new java.util.zip.ZipFile(file).withCloseable { zip ->
                        zip.entries().collect { it.name }
                                .findAll { it.startsWith(prefix) && it.endsWith('.class') && !it.substring(prefix.length()).contains('/') }
                                .each { println "${it[0..-7].replace('/', '.')}    (${file.name})" }
                    }
                }
            } else if (name.startsWith('!') && name.contains('#')) {
                // Only the members (two-space indented lines in javap's output) whose line holds the text.
                def (cls, text) = name.substring(1).split('#', 2)
                def out = new StringWriter()
                def writer = new PrintWriter(out)
                javap.run(writer, new PrintWriter(System.err, true), '-p', '-c', '-cp', classpath.asPath, cls)
                writer.flush()
                boolean printing = false
                out.toString().eachLine { line ->
                    if (line ==~ /^  \S.*/) {
                        printing = line.contains(text)
                    } else if (!line.startsWith(' ')) {
                        printing = false
                        println line
                        return
                    }
                    if (printing) {
                        println line
                    }
                }
            } else if (name.startsWith('!')) {
                javap.run(System.out, System.err, '-p', '-c', '-cp', classpath.asPath, name.substring(1))
            } else if (name.startsWith('~')) {
                javap.run(System.out, System.err, '-p', '-cp', classpath.asPath, name.substring(1))
            } else {
                javap.run(System.out, System.err, '-protected', '-cp', classpath.asPath, name)
            }
        }
    }
}
