name: CI

# What runs when (this is a private repo, so Actions minutes are budgeted):
# - every push:         build + unit tests for all Minecraft versions, then the real game on EVERY supported
#                       Minecraft release (1.21 ... 26.3) with the mod's in-game smoke test.
# - weekly, manually, on main, or a commit message containing [compat]:
#                       also the compat matrix (Sodium, Iris + Complementary/BSL, Voxy, Distant Horizons,
#                       ImmediatelyFast, Entity Culling, EMF/ETF, 3D Skin Layers, Figura) and the benchmark
#                       (shaders off and on).
# - a commit message containing [bench]: A/B benchmark of this commit against main (built from main here) on
#                       1.21.11 and 26.3, same scene, alternating runs; medians and ranges in the job summary.
# - a commit message containing [api-dump]: prints Minecraft class APIs listed in ci/api-dump.txt.
on:
  push:
  workflow_dispatch:
    inputs:
      compat:
        description: Also run the compat matrix and the benchmark
        type: boolean
        default: true
  schedule:
    - cron: "23 4 * * 1"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build all versions
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: gradle/actions/wrapper-validation@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            21
            25
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
      - name: Build and unit-test every Minecraft version
        # --continue: one broken version doesn't hide the others' results.
        run: ./gradlew build --continue
      - name: Upload jars
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: jars
          path: build/libs/*.jar
          if-no-files-found: warn
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: versions/*/build/reports/tests/

  runtime:
    name: In-game ${{ matrix.node }}
    needs: build
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        node: ["1.21.1", "1.21.3", "1.21.4", "1.21.5", "1.21.8", "1.21.10", "1.21.11", "26.1.2", "26.2", "26.3"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            21
            25
      - name: Install virtual display and software OpenGL
        run: sudo apt-get update -q && sudo apt-get install -yq --no-install-recommends xvfb x11-apps libgl1-mesa-dri libglx-mesa0 libegl1 libegl-mesa0 libopengl0
      - uses: actions/download-artifact@v4
        with:
          name: jars
          path: build/libs
      - uses: actions/cache@v4
        with:
          path: ci/work/cache
          key: mc-${{ matrix.node }}-${{ hashFiles('ci/versions.json', 'gradle.properties') }}
          restore-keys: mc-${{ matrix.node }}-
      - name: Run the game on every Minecraft release this jar covers
        run: python3 ci/mcci.py runtime --node "${{ matrix.node }}"
        env:
          # Also print small base64 copies of the screenshots into the log (readable without artifacts).
          MCCI_LOG_SCREENSHOTS: "1"
      - name: Upload logs and screenshots
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: runtime-${{ matrix.node }}
          path: |
            ci/work/runs/*/summary.json
            ci/work/runs/*/cosmeticsmod-results.json
            ci/work/runs/*/screenshot-*.png
            ci/work/runs/*/stdout.log
            ci/work/runs/*/logs/latest.log
            ci/work/runs/*/crash-reports/
            ci/work/runs/*/.mixin.out/
          if-no-files-found: warn

  compat:
    name: Compat ${{ matrix.node }}
    needs: build
    if: >-
      ${{ !cancelled() && (github.event_name == 'schedule'
      || (github.event_name == 'workflow_dispatch' && inputs.compat)
      || github.ref == 'refs/heads/main'
      || contains(github.event.head_commit.message, '[compat]')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        node: ["1.21.1", "1.21.3", "1.21.4", "1.21.5", "1.21.8", "1.21.10", "1.21.11", "26.1.2", "26.2", "26.3"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            21
            25
      - name: Install virtual display and software OpenGL
        run: sudo apt-get update -q && sudo apt-get install -yq --no-install-recommends xvfb x11-apps libgl1-mesa-dri libglx-mesa0 libegl1 libegl-mesa0 libopengl0
      - uses: actions/download-artifact@v4
        with:
          name: jars
          path: build/libs
      - uses: actions/cache@v4
        with:
          path: ci/work/cache
          key: mc-${{ matrix.node }}-${{ hashFiles('ci/versions.json', 'gradle.properties') }}
          restore-keys: mc-${{ matrix.node }}-
      - name: Run the game with each compat mod stack, then the benchmark
        run: python3 ci/mcci.py compat --node "${{ matrix.node }}" --benchmark
      - name: Upload logs and screenshots
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: compat-${{ matrix.node }}
          path: |
            ci/work/runs/*/summary.json
            ci/work/runs/*/cosmeticsmod-results.json
            ci/work/runs/*/screenshot-*.png
            ci/work/runs/*/stdout.log
            ci/work/runs/*/logs/latest.log
            ci/work/runs/*/crash-reports/
          if-no-files-found: warn

  summary:
    name: Test matrix
    needs: [runtime, compat]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: "{runtime,compat}-*"
          path: ci/work/runs
      - name: Write the matrix to the job summary
        run: python3 ci/mcci.py summarize --runs ci/work/runs --output compat-matrix.md
      - uses: actions/upload-artifact@v4
        with:
          name: compat-matrix
          path: compat-matrix.md

  bench:
    name: Benchmark A/B ${{ matrix.node }}
    needs: build
    if: ${{ !cancelled() && contains(github.event.head_commit.message, '[bench]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        node: ["1.21.11", "26.3"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            21
            25
      - uses: gradle/actions/setup-gradle@v4
      - name: Install virtual display and software OpenGL
        run: sudo apt-get update -q && sudo apt-get install -yq --no-install-recommends xvfb x11-apps libgl1-mesa-dri libglx-mesa0 libegl1 libegl-mesa0 libopengl0
      - uses: actions/download-artifact@v4
        with:
          name: jars
          path: build/libs
      - name: Build main for comparison
        run: |
          git worktree add "$RUNNER_TEMP/base" origin/main
          cd "$RUNNER_TEMP/base"
          ./gradlew ":${{ matrix.node }}:build" -x test
      - uses: actions/cache@v4
        with:
          path: ci/work/cache
          key: mc-${{ matrix.node }}-${{ hashFiles('ci/versions.json', 'gradle.properties') }}
          restore-keys: mc-${{ matrix.node }}-
      - name: Benchmark main and this commit, alternating
        run: |
          jar() { ls "$1"/*+mc${{ matrix.node }}.jar | grep -v -- '-sources' | head -1; }
          python3 ci/mcci.py bench-ab --node "${{ matrix.node }}" --rounds 4 \
            --base "$(jar "$RUNNER_TEMP/base/build/libs")" --head "$(jar build/libs)"
      - name: Upload results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: bench-${{ matrix.node }}
          path: |
            ci/work/bench/bench-ab.*
            ci/work/bench/*/summary.json
            ci/work/bench/*/cosmeticsmod-results.json
            ci/work/bench/*/logs/latest.log
          if-no-files-found: warn

  api-dump:
    name: API dump
    if: ${{ contains(github.event.head_commit.message, '[api-dump]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            21
            25
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
      - name: Print the requested Minecraft APIs
        run: |
          grep -vE '^\s*(#|$)' ci/api-dump.txt | while read -r version classes; do
            ./gradlew ":${version}:dumpApi" -PdumpClasses="${classes}" -q || echo "dumpApi failed for ${version}"
          done
