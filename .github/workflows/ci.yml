name: CI

# What runs when (this is a private repo, so Actions minutes are budgeted):
# - every push:         build + unit tests for all Minecraft versions, then the real game on EVERY supported
#                       Minecraft release (1.21 ... 26.3) with the mod's in-game smoke test.
# - weekly, manually, or a commit message containing [compat] ([compat=modmenu,figura] runs only
#   those stacks of ci/compat-sets.json, without the benchmark):
#                       also the compat matrix (Sodium, Iris + Complementary/BSL, Voxy, Distant Horizons,
#                       ImmediatelyFast, Entity Culling, EMF/ETF, 3D Skin Layers, Figura) and the benchmark
#                       (shaders off and on).
# - a commit message containing [bench]: A/B benchmark of this commit against main (built from main here) on
#                       1.21.11 and 26.3, same scene, alternating runs; medians and ranges in the job summary.
# - a commit message containing [api-dump]: prints Minecraft class APIs listed in ci/api-dump.txt.
# - a commit message containing [shots]: the in-game runs' screenshots of the mod's screens go to the
#                       ci-screenshots branch (one commit, replaced each time), to look at them with git alone.
#                       World shots (Atmosphere themes, stellar sky, items) go there too, full size, for one node
#                       per rendering era (1.21.1, 1.21.11, 26.3).
# - a commit message containing [quick]: only the build and unit tests (no game runs, no importer jobs).
# Normal CI never reads the private cosmetics pack; only personal-release.yml (manual) does.
on:
  push:
  workflow_dispatch:
    inputs:
      compat:
        description: Also run the compat matrix and the benchmark
        type: boolean
        default: true
  schedule:
    - cron: "23 4 * * 1"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build all versions
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: gradle/actions/wrapper-validation@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            21
            25
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
      - name: Build and unit-test every Minecraft version
        # --continue: one broken version doesn't hide the others' results.
        run: ./gradlew build --continue
      - name: No knife pack in the repo or the jars
        # The knife packs are all rights reserved; CI uses a stand-in knife the mod generates.
        if: ${{ !cancelled() }}
        run: python3 ci/pack_guard.py --jars build/libs/*.jar
      - name: Upload jars
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: jars
          path: build/libs/*.jar
          if-no-files-found: warn
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: versions/*/build/reports/tests/

  importer:
    # tools/badlion-import, tested only with synthetic fixtures the tests generate. Never reads Badlion files.
    name: Badlion importer tests (${{ matrix.os }})
    if: ${{ !contains(github.event.head_commit.message, '[quick]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    defaults:
      run:
        working-directory: tools/badlion-import
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the importer and pytest
        run: python -m pip install --quiet ".[test]"
      - name: Unit tests
        run: python -m pytest -q

  importer-pack:
    # The importer's output read by the mod's real parser: packs converted from the synthetic fixtures (never
    # Badlion files) must load without warnings and bake, with textures the size their cosmetics say.
    name: Badlion importer packs load in the mod
    if: ${{ !contains(github.event.head_commit.message, '[quick]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            21
            25
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true
      - name: Convert the synthetic fixtures
        working-directory: tools/badlion-import
        run: |
          python -m pip install --quiet ".[test]"
          python -m tests.make_packs "$RUNNER_TEMP/import"
      - name: Load every cosmetic of the packs with the mod's parser
        run: |
          report=versions/1.21.11/build/test-results/test/TEST-io.github.georgwav.cosmetics.model.ImportedPackTest.xml
          for pack in pack calibration clients; do
            ./gradlew :1.21.11:test --tests 'io.github.georgwav.cosmetics.model.ImportedPackTest' \
              "-Pcosmetics.validatePack=$RUNNER_TEMP/import/$pack"
            # A skipped test would pass silently: make sure it really ran.
            grep -q 'tests="1" skipped="0" failures="0" errors="0"' "$report" \
              || { echo "::error::ImportedPackTest didn't run on $pack"; cat "$report"; exit 1; }
          done

  personal-build:
    # The -Pcosmetics.bundleDir path of build.gradle, with a tiny pack made up right here (never the real
    # one, which only the manual personal-release workflow reads): the jar gets the pack's files and the
    # -personal name, and a pack file that clashes with one of the mod's own fails the build.
    name: Personal build check (synthetic pack)
    if: ${{ !contains(github.event.head_commit.message, '[quick]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            21
            25
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true
      - name: Make a synthetic pack
        run: |
          pack="$RUNNER_TEMP/pack/assets/synthetic"
          mkdir -p "$pack/cosmetics" "$pack/textures/cosmetic"
          cp src/main/resources/assets/cosmeticsmod/textures/cosmetic/halo.png "$pack/textures/cosmetic/box.png"
          echo '{"slot":"head","texture":"synthetic:textures/cosmetic/box.png","parts":[{"cubes":[{"from":[-1,-10,-1],"to":[1,-8,1],"uv":[0,0]}]}]}' > "$pack/cosmetics/box.json"
      - name: Build 1.21.11 with it
        run: ./gradlew :1.21.11:collectJar -x test --no-build-cache "-Pcosmetics.bundleDir=$RUNNER_TEMP/pack"
      - name: The jar is named -personal and holds the pack
        run: |
          jar=$(ls build/libs/*+mc1.21.11-personal.jar)
          unzip -l "$jar" | grep -q 'assets/synthetic/cosmetics/box.json'
          unzip -l "$jar" | grep -q 'assets/cosmeticsmod/cosmetics/top_hat.json'
          echo "OK: $jar"
      - name: A pack file that clashes with the mod's own fails the build
        run: |
          mkdir -p "$RUNNER_TEMP/pack/assets/cosmeticsmod/cosmetics"
          cp src/main/resources/assets/cosmeticsmod/cosmetics/top_hat.json "$RUNNER_TEMP/pack/assets/cosmeticsmod/cosmetics/"
          if ./gradlew :1.21.11:processResources --no-build-cache -q "-Pcosmetics.bundleDir=$RUNNER_TEMP/pack"; then
            echo "::error::A clashing pack file was copied over the mod's own"
            exit 1
          fi

  runtime:
    name: In-game ${{ matrix.node }}
    needs: build
    if: ${{ !cancelled() && !contains(github.event.head_commit.message, '[quick]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        node: ["1.21.1", "1.21.3", "1.21.4", "1.21.5", "1.21.8", "1.21.10", "1.21.11", "26.1.2", "26.2", "26.3"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            21
            25
      - name: Install virtual display and software OpenGL
        run: sudo apt-get update -q && sudo apt-get install -yq --no-install-recommends xvfb x11-apps libgl1-mesa-dri libglx-mesa0 libegl1 libegl-mesa0 libopengl0
      - uses: actions/download-artifact@v4
        with:
          name: jars
          path: build/libs
      - uses: actions/cache@v4
        with:
          path: ci/work/cache
          key: mc-${{ matrix.node }}-${{ hashFiles('ci/versions.json', 'gradle.properties') }}
          restore-keys: mc-${{ matrix.node }}-
      - name: Run the game on every Minecraft release this jar covers
        run: python3 ci/mcci.py runtime --node "${{ matrix.node }}"
        env:
          # Also print small base64 copies of the screenshots into the log (readable without artifacts).
          MCCI_LOG_SCREENSHOTS: "1"
      - name: The Sol look (every theme on the reference nodes, the reference frames everywhere)
        if: ${{ !cancelled() }}
        run: |
          case "${{ matrix.node }}" in 1.21.1|1.21.11|26.3) set=full ;; *) set=reduced ;; esac
          python3 ci/mcci.py look --node "${{ matrix.node }}" --sol "$set"
        env:
          MCCI_LOG_SCREENSHOTS: "1"
      - name: Upload logs and screenshots
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: runtime-${{ matrix.node }}
          path: |
            ci/work/runs/*/summary.json
            ci/work/runs/*/cosmeticsmod-results.json
            ci/work/runs/*/cosmeticsmod-sol-results.json
            ci/work/runs/*/screenshot-*.png
            ci/work/runs/*/stdout.log
            ci/work/runs/*/logs/latest.log
            ci/work/runs/*/crash-reports/
            ci/work/runs/*/.mixin.out/
          if-no-files-found: warn

  shots:
    # A commit message containing [shots]: the in-game runs' screenshots of the mod's screens, full size, as one
    # commit on the ci-screenshots branch (replacing the last), so they can be looked at with git alone.
    name: Screen screenshots to the ci-screenshots branch
    needs: runtime
    if: ${{ !cancelled() && contains(github.event.head_commit.message, '[shots]') }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: runtime-*
          path: artifacts
      - name: Push them
        env:
          TOKEN: ${{ github.token }}
        run: |
          mkdir pub
          for dir in artifacts/runtime-*; do
            node="${dir#artifacts/runtime-}"
            mkdir -p "pub/$node"
            (cd "$dir" && find . -name 'screenshot-ui*.png' -exec cp --parents {} "$GITHUB_WORKSPACE/pub/$node/" \;)
            # The Ember reference frames on every node (the like-for-like check); every theme on the reference nodes.
            (cd "$dir" && find . -name 'screenshot-sol_ember*.png' -exec cp --parents {} "$GITHUB_WORKSPACE/pub/$node/" \;)
            case "$node" in 1.21.1|1.21.11|26.3)
              (cd "$dir" && find . -name 'screenshot-sol*.png' -exec cp --parents {} "$GITHUB_WORKSPACE/pub/$node/" \;) ;;
            esac
          done
          cd pub
          echo "$GITHUB_SHA" > commit.txt
          git init -q -b ci-screenshots
          git add -A
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "Screenshots of ${GITHUB_SHA::7}"
          git push -q --force "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" ci-screenshots

  compat:
    name: Compat ${{ matrix.node }}
    needs: build
    if: >-
      ${{ !cancelled() && (github.event_name == 'schedule'
      || (github.event_name == 'workflow_dispatch' && inputs.compat)
      || contains(github.event.head_commit.message, '[compat]')
      || contains(github.event.head_commit.message, '[compat=')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        node: ["1.21.1", "1.21.3", "1.21.4", "1.21.5", "1.21.8", "1.21.10", "1.21.11", "26.1.2", "26.2", "26.3"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            21
            25
      - name: Install virtual display and software OpenGL
        run: sudo apt-get update -q && sudo apt-get install -yq --no-install-recommends xvfb x11-apps libgl1-mesa-dri libglx-mesa0 libegl1 libegl-mesa0 libopengl0
      - uses: actions/download-artifact@v4
        with:
          name: jars
          path: build/libs
      - uses: actions/cache@v4
        with:
          path: ci/work/cache
          key: mc-${{ matrix.node }}-${{ hashFiles('ci/versions.json', 'gradle.properties') }}
          restore-keys: mc-${{ matrix.node }}-
      - name: Run the game with each compat mod stack, then the benchmark
        env:
          MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          # [compat=a,b] runs only those stacks (no benchmark); [compat] runs all of them.
          sets=$(printf '%s' "$MESSAGE" | grep -oE '\[compat=[a-z0-9,-]+\]' | head -1 | sed -E 's/^\[compat=|\]$//g' || true)
          if [ -n "$sets" ]; then
            python3 ci/mcci.py compat --node "${{ matrix.node }}" --sets "$sets"
          else
            python3 ci/mcci.py compat --node "${{ matrix.node }}" --benchmark
          fi
      - name: Upload logs and screenshots
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: compat-${{ matrix.node }}
          path: |
            ci/work/runs/*/summary.json
            ci/work/runs/*/cosmeticsmod-results.json
            ci/work/runs/*/screenshot-*.png
            ci/work/runs/*/stdout.log
            ci/work/runs/*/logs/latest.log
            ci/work/runs/*/crash-reports/
          if-no-files-found: warn

  summary:
    name: Test matrix
    needs: [runtime, compat]
    if: ${{ always() && !contains(github.event.head_commit.message, '[quick]') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: "{runtime,compat}-*"
          path: ci/work/runs
      - name: Write the matrix to the job summary
        run: python3 ci/mcci.py summarize --runs ci/work/runs --output compat-matrix.md
      - uses: actions/upload-artifact@v4
        with:
          name: compat-matrix
          path: compat-matrix.md

  bench:
    name: Benchmark A/B ${{ matrix.node }}
    needs: build
    if: ${{ !cancelled() && contains(github.event.head_commit.message, '[bench]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        node: ["1.21.11", "26.3"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            21
            25
      - uses: gradle/actions/setup-gradle@v4
      - name: Install virtual display and software OpenGL
        run: sudo apt-get update -q && sudo apt-get install -yq --no-install-recommends xvfb x11-apps libgl1-mesa-dri libglx-mesa0 libegl1 libegl-mesa0 libopengl0
      - uses: actions/download-artifact@v4
        with:
          name: jars
          path: build/libs
      - name: Build main for comparison
        run: |
          git worktree add "$RUNNER_TEMP/base" origin/main
          cd "$RUNNER_TEMP/base"
          ./gradlew ":${{ matrix.node }}:build" -x test
      - uses: actions/cache@v4
        with:
          path: ci/work/cache
          key: mc-${{ matrix.node }}-${{ hashFiles('ci/versions.json', 'gradle.properties') }}
          restore-keys: mc-${{ matrix.node }}-
      - name: Benchmark main and this commit, alternating
        run: |
          jar() { ls "$1"/*+mc${{ matrix.node }}.jar | grep -v -- '-sources' | head -1; }
          python3 ci/mcci.py bench-ab --node "${{ matrix.node }}" --rounds 4 \
            --base "$(jar "$RUNNER_TEMP/base/build/libs")" --head "$(jar build/libs)"
      - name: Upload results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: bench-${{ matrix.node }}
          path: |
            ci/work/bench/bench-ab.*
            ci/work/bench/*/summary.json
            ci/work/bench/*/cosmeticsmod-results.json
            ci/work/bench/*/logs/latest.log
          if-no-files-found: warn

  api-dump:
    name: API dump
    if: ${{ contains(github.event.head_commit.message, '[api-dump]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            21
            25
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
      - name: Print the requested Minecraft APIs
        run: |
          grep -vE '^\s*(#|$)' ci/api-dump.txt | while read -r version classes; do
            ./gradlew ":${version}:dumpApi" -PdumpClasses="${classes}" -q || echo "dumpApi failed for ${version}"
          done
